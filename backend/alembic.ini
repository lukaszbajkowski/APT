[alembic]
script_location = alembic
# Katalog backendu na ścieżce importów, żeby env.py widział pakiet "app"
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# Adres bazy pochodzi z APT_DATABASE_URL (patrz alembic/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
