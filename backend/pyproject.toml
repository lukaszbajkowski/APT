[project]
name = "apt-backend"
version = "0.1.0"
description = "Identyfikacja pracowników APT – API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160,<0.200",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "pillow>=11",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "numbers-parser>=4.10",
    "reportlab>=4.2",
    "docxtpl>=0.18",
    "pypdf>=4",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pyhanko>=0.25",
    "pyhanko-certvalidator>=0.26",
    "webauthn>=2.5",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042/UP046: zostajemy przy str+Enum i Generic[T] (czytelne, zgodne z Pydantic)
ignore = ["UP042", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
