name: apt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APT_SECRET_KEY: ${APT_SECRET_KEY}
      APT_DATA_KEY: ${APT_DATA_KEY:?Ustaw APT_DATA_KEY w pliku .env}
      APT_DATA_DIR: /app/data
      APT_COOKIE_SECURE: ${APT_COOKIE_SECURE:-true}
      APT_SESSION_IDLE_MINUTES: ${APT_SESSION_IDLE_MINUTES:-30}
      APT_SESSION_MAX_HOURS: ${APT_SESSION_MAX_HOURS:-12}
      APT_LOGIN_MAX_FAILURES: ${APT_LOGIN_MAX_FAILURES:-5}
      APT_LOGIN_LOCK_MINUTES: ${APT_LOGIN_LOCK_MINUTES:-15}
    volumes:
      - appdata:/app/data
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      APT_DOMAIN: ${APT_DOMAIN:-localhost}
    ports:
      - "${APT_HTTP_PORT:-80}:80"
      - "${APT_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:

networks:
  internal:
