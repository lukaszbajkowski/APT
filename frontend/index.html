<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F4F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS (aplikacja z ekranu początkowego): strona zajmuje cały ekran, a górny pasek obsługuje nagłówek przez safe-area. Bez tego iOS przesuwa stronę o wysokość paska statusu i dół strony (nad dolnym menu) jest nieosiągalny. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APT iD" />
    <title>Identyfikacja pracowników APT</title>
    <meta name="description" content="APT iD – aplikacja dla pracowników i kadr APT: karty identyfikacyjne, dokumenty i podpisy." />
    <!-- podgląd linku w komunikatorach (zaproszenia, reset hasła wysyłane SMS-em lub w WhatsAppie) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APT iD" />
    <meta property="og:title" content="APT iD – Identyfikacja pracowników APT" />
    <meta property="og:description" content="Karty, dokumenty i podpisy w jednym miejscu. Zaloguj się kontem otrzymanym od kadr." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo APT iD" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
